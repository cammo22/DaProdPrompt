<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DaProdPrompt: genera prompt completi con una slot machine creativa.">
  <title>DaProdPrompt — Prompt slot machine</title>
  <style>
    :root { color-scheme: dark; --bg: #101126; --panel: #191b3d; --text: #f7f5ff; --muted: #b5b5d5; --accent: #ffcb4d; --accent-2: #70e1ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); background: radial-gradient(circle at 15% 10%, #303267 0, transparent 35%), var(--bg); }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { margin: 0 0 10px; font-size: clamp(2.25rem, 6vw, 4.5rem); letter-spacing: -.06em; }
    header p { margin: 0 auto; max-width: 620px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
    .machine { background: color-mix(in srgb, var(--panel) 92%, black); border: 1px solid #3a3d72; border-radius: 24px; padding: clamp(20px, 4vw, 40px); box-shadow: 0 24px 80px #05051166; }
    .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .reel { min-height: 140px; display: grid; place-items: center; padding: 20px 12px; text-align: center; background: linear-gradient(145deg, #292c5e, #12142f); border: 2px solid #54589a; border-radius: 16px; font-size: clamp(1.05rem, 3vw, 1.45rem); font-weight: 800; }
    .reel small { display: block; margin-bottom: 8px; color: var(--accent-2); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 24px 0; }
    button { border: 0; border-radius: 999px; padding: 13px 22px; color: #111226; background: var(--accent); font: inherit; font-weight: 800; cursor: pointer; transition: transform .15s, filter .15s; }
    button:hover { filter: brightness(1.08); transform: translateY(-2px); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    button.secondary { color: var(--text); background: #35386e; }
    .result { margin-top: 20px; padding: 22px; background: #0e1028; border: 1px solid #35386e; border-radius: 16px; }
    .result h2 { margin: 0 0 12px; font-size: 1rem; color: var(--accent); }
    #prompt { margin: 0; white-space: pre-wrap; line-height: 1.65; color: #f0efff; }
    #status { min-height: 1.5em; margin: 14px 0 0; text-align: center; color: var(--muted); font-size: .92rem; }
    footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: .85rem; }
    @media (max-width: 640px) { main { padding: 32px 0; } .reels { grid-template-columns: 1fr; } .reel { min-height: 90px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DaProdPrompt</h1>
      <p>Fai girare la slot machine e crea combinazioni originali per costruire il tuo prossimo prompt.</p>
    </header>
    <section class="machine" aria-label="Generatore di prompt">
      <div class="reels">
        <div class="reel"><div><small>Ruolo</small><span id="role"></span></div></div>
        <div class="reel"><div><small>Obiettivo</small><span id="goal"></span></div></div>
        <div class="reel"><div><small>Stile</small><span id="style"></span></div></div>
      </div>
      <div class="actions">
        <button id="spin" type="button">Gira la slot machine</button>
        <button id="copy" class="secondary" type="button">Copia prompt</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="result">
        <h2>Il tuo prompt</h2>
        <p id="prompt"></p>
      </div>
    </section>
    <footer>Un piccolo laboratorio creativo open source.</footer>
  </main>
  <script>
    const options = {
      role: ["un product designer visionario", "un tutor paziente", "un marketing strategist", "un narratore cinematografico", "un software architect"],
      goal: ["spiegare un concetto complesso", "progettare una soluzione concreta", "scrivere una storia memorabile", "creare una strategia efficace", "trasformare un'idea in un piano d'azione"],
      style: ["chiaro, pratico e sintetico", "creativo e sorprendente", "professionale ma accessibile", "ironico e coinvolgente", "strutturato in passi numerati"]
    };
    const labels = { role: "Ruolo", goal: "Obiettivo", style: "Stile" };
    const values = {};
    const pick = (items) => items[Math.floor(Math.random() * items.length)];
    const promptElement = document.querySelector("#prompt");
    const statusElement = document.querySelector("#status");

    function spin() {
      Object.keys(options).forEach((key) => {
        values[key] = pick(options[key]);
        document.querySelector(`#${key}`).textContent = values[key];
      });
      promptElement.textContent = `Agisci come ${values.role}.\n\nObiettivo: ${values.goal}.\n\nUsa uno stile ${values.style}. Fornisci una risposta utile, originale e pronta da usare.`;
      statusElement.textContent = "Nuova combinazione generata.";
    }

    async function copyPrompt() {
      const text = promptElement.textContent.trim();
      if (!text) {
        statusElement.textContent = "Genera prima un prompt.";
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          if (!document.execCommand("copy")) throw new Error("copy command failed");
          area.remove();
        }
        statusElement.textContent = "Prompt copiato negli appunti.";
      } catch (error) {
        statusElement.textContent = "Copia non riuscita: seleziona il testo manualmente.";
        console.error("Impossibile copiare il prompt:", error);
      }
    }

    document.querySelector("#spin").addEventListener("click", spin);
    document.querySelector("#copy").addEventListener("click", copyPrompt);
    spin();
  </script>
</body>
</html>
